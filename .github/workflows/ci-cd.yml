name: CI/CD Pipeline

on:
  push:
    branches:
      - huzaifa
      - main
  pull_request:
    branches:
      - huzaifa
      - main

env:
  BACKEND_IMAGE: grocery_backend
  FRONTEND_IMAGE: grocery_frontend

jobs:
  # --------------------------
  # Build Backend
  # --------------------------
  build_backend:
    name: Build Backend Docker Image
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build Backend Docker Image
        run: |
          echo "🐳 Building Backend Docker image..."
          docker build -t ${{ env.BACKEND_IMAGE }}:${{ github.sha }} -f grocery_backend/Dockerfile ./grocery_backend
          docker tag ${{ env.BACKEND_IMAGE }}:${{ github.sha }} ${{ env.BACKEND_IMAGE }}:latest
      
      - name: Save Backend Docker Image
        run: |
          docker save ${{ env.BACKEND_IMAGE }}:${{ github.sha }} | gzip > backend-image.tar.gz
      
      - name: Upload Backend Image Artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-image
          path: backend-image.tar.gz
          retention-days: 1

  # --------------------------
  # Build Frontend
  # --------------------------
  build_frontend:
    name: Build Frontend Docker Image
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build Frontend Docker Image
        run: |
          echo "⚛️ Building Frontend Docker image..."
          docker build -t ${{ env.FRONTEND_IMAGE }}:${{ github.sha }} -f grocery-frontend/Dockerfile ./grocery-frontend
          docker tag ${{ env.FRONTEND_IMAGE }}:${{ github.sha }} ${{ env.FRONTEND_IMAGE }}:latest
      
      - name: Save Frontend Docker Image
        run: |
          docker save ${{ env.FRONTEND_IMAGE }}:${{ github.sha }} | gzip > frontend-image.tar.gz
      
      - name: Upload Frontend Image Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-image
          path: frontend-image.tar.gz
          retention-days: 1

  # --------------------------
  # Test
  # --------------------------
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: [build_backend]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install dependencies
        run: |
          echo "📦 Installing Python dependencies..."
          cd grocery_backend
          pip install -r requirements.txt
      
      - name: Run tests
        run: |
          echo "🧪 Running tests..."
          cd grocery_backend
          pytest || echo "⚠️ No tests found or tests failed"

  # --------------------------
  # Deploy to AWS EC2
  # --------------------------
  deploy_production:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest
    needs: [build_backend, build_frontend, test]
    if: github.event_name == 'push'
    environment:
      name: production
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Debug Information
        run: |
          echo "📋 Deployment Information:"
          echo "Branch: ${{ github.ref }}"
          echo "Event: ${{ github.event_name }}"
          echo "Commit: ${{ github.sha }}"
          echo "Repository: ${{ github.repository }}"
      
      - name: Validate Secrets
        run: |
          echo "🔍 Validating GitHub Secrets and Variables..."
          if [ -z "${{ secrets.SSH_PRIVATE_KEY }}" ]; then
            echo "❌ SSH_PRIVATE_KEY secret is not set"
            exit 1
          fi
          if [ -z "${{ secrets.DEPLOY_HOST }}" ]; then
            echo "❌ DEPLOY_HOST secret is not set"
            exit 1
          fi
          if [ -z "${{ secrets.DEPLOY_USER }}" ]; then
            echo "❌ DEPLOY_USER secret is not set"
            exit 1
          fi
          if [ -z "${{ secrets.MONGODB_URL }}" ]; then
            echo "❌ MONGODB_URL secret is not set"
            exit 1
          fi
          if [ -z "${{ secrets.SECRET_KEY }}" ]; then
            echo "❌ SECRET_KEY secret is not set"
            exit 1
          fi
          echo "✅ All required secrets are configured"
          echo "✅ Variables: DATABASE_NAME=${{ vars.DATABASE_NAME || 'grocery_db' }}"
          echo "✅ Variables: DEBUG=${{ vars.DEBUG || 'False' }}"
          echo "✅ Variables: ALLOWED_ORIGINS=${{ vars.ALLOWED_ORIGINS || 'http://localhost:5173' }}"
          echo "🌐 Deployment URL: http://${{ secrets.DEPLOY_HOST }}:5173"
      
      - name: Setup SSH
        run: |
          echo "🔑 Setting up SSH..."
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts 2>/dev/null
          chmod 644 ~/.ssh/known_hosts
      
      - name: Test SSH Connection
        run: |
          echo "🔌 Testing SSH connection..."
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10 -i ~/.ssh/id_rsa ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} "echo '✅ SSH connection successful'"
      
      - name: Deploy to EC2
        env:
          # Secrets (sensitive data)
          MONGODB_URL: ${{ secrets.MONGODB_URL }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          # Variables (non-sensitive config)
          DATABASE_NAME: ${{ vars.DATABASE_NAME || 'grocery_db' }}
          ALLOWED_ORIGINS: ${{ vars.ALLOWED_ORIGINS || 'http://localhost:5173' }}
          DEBUG: ${{ vars.DEBUG || 'False' }}
          ALGORITHM: ${{ vars.ALGORITHM || 'HS256' }}
          ACCESS_TOKEN_EXPIRE_MINUTES: ${{ vars.ACCESS_TOKEN_EXPIRE_MINUTES || '30' }}
          HOST: ${{ vars.HOST || '0.0.0.0' }}
          PORT: ${{ vars.PORT || '8000' }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          echo "🚀 Deploying to AWS EC2..."
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            "export MONGODB_URL='${MONGODB_URL}' && \
             export DATABASE_NAME='${DATABASE_NAME}' && \
             export SECRET_KEY='${SECRET_KEY}' && \
             export ALLOWED_ORIGINS='${ALLOWED_ORIGINS}' && \
             export DEBUG='${DEBUG}' && \
             export ALGORITHM='${ALGORITHM}' && \
             export ACCESS_TOKEN_EXPIRE_MINUTES='${ACCESS_TOKEN_EXPIRE_MINUTES}' && \
             export HOST='${HOST}' && \
             export PORT='${PORT}' && \
             export REPO_NAME='${{ github.repository }}' && \
             export BRANCH_NAME='${{ github.ref_name }}' && \
             export DEPLOY_HOST='${DEPLOY_HOST}'" bash << ENDSSH
            set -e
            
            echo "📋 Deploying branch: ${BRANCH_NAME}"
            echo "📦 Repository: ${REPO_NAME}"
            
            # Detect OS and set package manager
            if [ -f /etc/os-release ]; then
              . /etc/os-release
              OS=$ID
              echo "🖥️ Detected OS: $OS"
            fi
            
            # Update system packages based on OS
            echo "📦 Updating system packages..."
            if command -v apt-get &> /dev/null; then
              sudo apt-get update -y
              sudo apt-get install -y docker.io git
            elif command -v yum &> /dev/null; then
              sudo yum update -y
              sudo yum install -y docker git
            elif command -v dnf &> /dev/null; then
              sudo dnf update -y
              sudo dnf install -y docker git
            else
              echo "❌ Unsupported package manager"
              exit 1
            fi
            
            # Install latest Docker Compose
            echo "📦 Installing latest Docker Compose..."
            DOCKER_COMPOSE_LATEST=$(curl -s https://api.github.com/repos/docker/compose/releases/latest | grep browser_download_url | grep $(uname -s)-$(uname -m) | cut -d '"' -f 4)
            sudo curl -L "$DOCKER_COMPOSE_LATEST" -o /usr/local/bin/docker-compose
            sudo chmod +x /usr/local/bin/docker-compose
            docker-compose version
              # Install latest Docker Buildx
            echo "📦 Installing latest Docker Buildx..."
            BUILDX_LATEST=$(curl -s https://api.github.com/repos/docker/buildx/releases/latest | grep browser_download_url | grep linux-$(uname -m) | cut -d '"' -f 4)
            sudo mkdir -p /usr/lib/docker/cli-plugins
            sudo curl -L "$BUILDX_LATEST" -o /usr/lib/docker/cli-plugins/docker-buildx
            sudo chmod +x /usr/lib/docker/cli-plugins/docker-buildx
            docker buildx version
            
            # Start Docker service
            echo "🐳 Starting Docker service..."
            sudo systemctl start docker || sudo service docker start
            sudo systemctl enable docker || sudo chkconfig docker on
            
            # Add user to docker group
            sudo usermod -aG docker $USER || true
            
            # Create project directory if it doesn't exist
            PROJECT_DIR=~/grocery_app
            if [ ! -d "$PROJECT_DIR" ]; then
              echo "📁 Cloning repository from https://github.com/${REPO_NAME}.git ..."
              git clone https://github.com/${REPO_NAME}.git $PROJECT_DIR
              cd $PROJECT_DIR
              git checkout ${BRANCH_NAME}
            else
              cd $PROJECT_DIR
              
              # Clean Python cache
              echo "🧹 Cleaning cache..."
              find . -type d -name '__pycache__' -exec rm -rf {} + 2>/dev/null || true
              find . -type f -name '*.pyc' -delete 2>/dev/null || true
              find . -type d -name 'node_modules' -exec rm -rf {} + 2>/dev/null || true
              
              # Fetch and pull latest changes
              echo "🔄 Pulling latest changes from ${BRANCH_NAME}..."
              git fetch origin
              git checkout ${BRANCH_NAME}
              git reset --hard origin/${BRANCH_NAME}
              git pull origin ${BRANCH_NAME}
            fi
            
            # Create .env file for backend with GitHub Secrets and Variables
            echo "📝 Creating/updating .env file with GitHub configuration..."
            mkdir -p grocery_backend

            echo "MONGO_URI=${MONGODB_URL}" > grocery_backend/.env
            echo "SECRET_KEY=${SECRET_KEY}" >> grocery_backend/.env
            echo "ALGORITHM=${ALGORITHM}" >> grocery_backend/.env
            echo "ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES}" >> grocery_backend/.env
            echo "DEBUG=${DEBUG}" >> grocery_backend/.env
            echo "ALLOWED_ORIGINS=${ALLOWED_ORIGINS}" >> grocery_backend/.env
            echo "HOST=${HOST}" >> grocery_backend/.env
            echo "PORT=${PORT}" >> grocery_backend/.env
            echo "OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}" >> grocery_backend/.env
            echo "PRODUCT_API_URL=${{ secrets.PRODUCT_API_URL }}" >> grocery_backend/.env
            echo "BACKEND_API_URL=${{ secrets.BACKEND_API_URL }}" >> grocery_backend/.env

            chmod 644 grocery_backend/.env
            echo "✅ .env file created with GitHub Secrets and Variables"
            echo "📄 .env file contents (sanitized):"
            cat grocery_backend/.env | sed 's/SECRET_KEY=.*/SECRET_KEY=***HIDDEN***/' | sed 's/OPENAI_API_KEY=.*/OPENAI_API_KEY=***HIDDEN***/' | sed 's/MONGO_URI=.*/MONGO_URI=***HIDDEN***/' || echo "❌ .env NOT FOUND"

            echo "🔍 Debug: Verifying .env exists..."
            ls -lh grocery_backend/.env || echo "❌ File does not exist!"
            
            # Stop existing containers
            echo "🛑 Stopping existing containers..."
            sudo docker-compose down --remove-orphans 2>/dev/null || true
            
            # Remove old images
            echo "🗑️ Cleaning up old Docker images..."
            sudo docker system prune -af --volumes || true
            
            # Build and start containers
            echo "🐳 Building and starting containers..."
            sudo docker-compose up -d --build --force-recreate
            
            # Wait for services to be ready
            echo "⏳ Waiting for services to start..."
            sleep 15
            
            # Show status
            echo "✅ Deployment complete!"
            sudo docker-compose ps
            
            # Show logs
            echo "📋 Recent logs:"
            sudo docker-compose logs --tail=100
            
            # Check if containers are running
            echo "🔍 Verifying containers..."
            if ! sudo docker-compose ps | grep -q "Up"; then
              echo "❌ Containers failed to start!"
              echo "📋 Full container logs:"
              sudo docker-compose logs
              exit 1
            fi
            
            echo "✅ Containers are running!"
          ENDSSH
      
      - name: Health Check - Backend
        run: |
          echo "🏥 Health Check - Backend API..."
          sleep 10
          
          for i in {1..10}; do
            echo "Attempt $i/10: Checking http://${{ secrets.DEPLOY_HOST }}:8000/docs"
            if curl -f -s --max-time 10 http://${{ secrets.DEPLOY_HOST }}:8000/docs > /dev/null 2>&1; then
              echo "✅ Backend API is healthy!"
              break
            else
              if [ $i -eq 10 ]; then
                echo "❌ Backend API failed health check after 10 attempts"
                exit 1
              fi
              echo "⏳ Backend not ready yet, waiting 5 seconds..."
              sleep 5
            fi
          done
      
      - name: Health Check - Frontend
        run: |
          echo "🏥 Health Check - Frontend..."
          
          for i in {1..10}; do
            echo "Attempt $i/10: Checking http://${{ secrets.DEPLOY_HOST }}:5173"
            if curl -f -s --max-time 10 http://${{ secrets.DEPLOY_HOST }}:5173 > /dev/null 2>&1; then
              echo "✅ Frontend is healthy!"
              break
            else
              if [ $i -eq 10 ]; then
                echo "❌ Frontend failed health check after 10 attempts"
                exit 1
              fi
              echo "⏳ Frontend not ready yet, waiting 5 seconds..."
              sleep 5
            fi
          done
          
          echo "✅ All services are healthy!"
      
      - name: Cleanup SSH
        if: always()
        run: |
          rm -f ~/.ssh/id_rsa
          echo "🧹 SSH keys cleaned up"

  # --------------------------
  # Notify on Success/Failure
  # --------------------------
  notify:
    name: Notify Deployment Status
    runs-on: ubuntu-latest
    needs: [deploy_production]
    if: always() && github.event_name == 'push'
    
    steps:
      - name: Deployment Success
        if: needs.deploy_production.result == 'success'
        run: |
          echo "✅ Deployment successful!"
          echo "🌐 Frontend: http://${{ secrets.DEPLOY_HOST }}:5173"
          echo "🔧 Backend API: http://${{ secrets.DEPLOY_HOST }}:8000"
          echo "📚 API Docs: http://${{ secrets.DEPLOY_HOST }}:8000/docs"
          echo "🗄️ MongoDB: mongodb://${{ secrets.DEPLOY_HOST }}:27017"
      
      - name: Deployment Failed
        if: needs.deploy_production.result == 'failure'
        run: |
          echo "❌ Deployment failed!"
          echo "Please check the logs above for details."
          exit 1