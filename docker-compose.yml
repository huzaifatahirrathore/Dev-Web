services:
  # Backend Service (FastAPI)
  backend:
    build: ./grocery_backend
    container_name: grocery_backend
    ports:
      - "8000:8000"
    env_file:
      - ./grocery_backend/.env
    volumes:
      - ./grocery_backend:/app
    networks:
      - grocery_network
    command: python main.py

  # Chatbot Service (FastAPI with AI)
  chatbot:
    build: ./grocery_backend
    container_name: grocery_chatbot
    ports:
      - "8001:8001"
    env_file:
      - ./grocery_backend/.env
    environment:
      PRODUCT_API_URL: http://backend:8000/products
      BACKEND_API_URL: http://backend:8000
    depends_on:
      - backend
    volumes:
      - ./grocery_backend:/app
    networks:
      - grocery_network
    command: uvicorn chatbot:app --host 0.0.0.0 --port 8001 --reload

  # Frontend Service (React)
  frontend:
    build: ./grocery-frontend
    container_name: grocery_frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://backend:8000
    depends_on:
      - backend
    volumes:
      - ./grocery-frontend/src:/app/src
    networks:
      - grocery_network

networks:
  grocery_network:
    driver: bridge
